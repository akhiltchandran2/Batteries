name: Batteries
options:
  bundleIdPrefix: com.akhilchandran
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 5BQPGJKD7M
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Batteries:
    type: application
    platform: macOS
    sources:
      - path: Sources/Batteries
    # A separate plist from Resources/Info.plist: that one is copied
    # verbatim (no variable substitution) by build.sh for the plain
    # SwiftPM build, so it can't use Xcode's $(VARIABLE) placeholders.
    info:
      path: Resources/Info-Xcode.plist
      properties:
        CFBundleDisplayName: Batteries
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akhilchandran.batteries
        PRODUCT_NAME: Batteries
    dependencies:
      - target: BatteriesWidgetExtension
        embed: true
  BatteriesWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/BatteriesWidget
      - path: Sources/Batteries/WidgetSnapshot.swift
    info:
      path: Sources/BatteriesWidget/Info.plist
      properties:
        CFBundleDisplayName: Batteries
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akhilchandran.batteries.widget
        PRODUCT_NAME: BatteriesWidgetExtension
        SKIP_INSTALL: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
